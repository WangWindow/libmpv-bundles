name: Build libmpv bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mpv_tag:
        description: "mpv release tag to package"
        required: true

permissions:
  contents: write

env:
  MPV_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mpv_tag || github.ref_name }}
  FFMPEG_TAG: n9.0.2
  LIBPLACEBO_TAG: v7.387.0

jobs:
  windows:
    name: Windows ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            target: x86_64
          - rid: win-arm64
            target: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Package official LGPL runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ matrix.rid }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/package-windows.sh

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            git \
            nasm \
            patchelf \
            libass-dev \
            liblcms2-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfontconfig1-dev \
            libunibreak-dev \
            libbluray-dev \
            libzimg-dev \
            zlib1g-dev \
            libdav1d-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libvulkan-dev

      - name: Build LGPL libmpv
        env:
          RID: ${{ matrix.rid }}
        run: bash scripts/build-linux.sh

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release assets
    if: github.ref_type == 'tag'
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
